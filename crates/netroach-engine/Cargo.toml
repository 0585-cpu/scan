[package]
name = "netroach-engine"
version = "0.1.0"
edition = "2021"
# The engine source needs 1.83 (io::ErrorKind::HostUnreachable), but the
# locked dependency tree needs 1.88 - verified by the rust-msrv CI job.
rust-version = "1.88"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
ipnet = "2.10"
native-tls = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["full"] }
tokio-native-tls = "0.3"
x509-parser = "0.16"
