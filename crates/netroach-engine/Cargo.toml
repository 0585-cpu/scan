[package]
name = "netroach-engine"
version = "0.2.3"
edition = "2021"
# The engine source needs 1.83 (io::ErrorKind::HostUnreachable), but the
# locked dependency tree needs 1.88 - verified by the rust-msrv CI job.
rust-version = "1.88"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
ipnet = "2.10"
native-tls = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["full"] }
tokio-native-tls = "0.3"
x509-parser = "0.16"
pcap = { version = "2", optional = true }
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
] }

[features]
default = []
syn-sweep = ["dep:pcap", "dep:windows-sys"]

# These drive Npcap directly, so they only build when the sweep feature
# pulls the pcap crate in - the default build and its tests never touch them.
[[example]]
name = "probe_pcap"
required-features = ["syn-sweep"]

[[example]]
name = "loopback_roundtrip"
required-features = ["syn-sweep"]

[[example]]
name = "resolve_route"
required-features = ["syn-sweep"]
