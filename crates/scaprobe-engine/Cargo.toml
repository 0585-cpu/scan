[package]
name = "scaprobe-engine"
version = "0.1.0"
edition = "2021"
# io::ErrorKind::HostUnreachable / NetworkUnreachable were stabilized in 1.83.
rust-version = "1.83"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
ipnet = "2.10"
native-tls = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["full"] }
tokio-native-tls = "0.3"
x509-parser = "0.16"
