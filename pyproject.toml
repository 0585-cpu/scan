[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netroach"
dynamic = ["version"]
description = "Authorized network scanner, pcap analyzer, and packet crafting toolkit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "scapy>=2.5.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "uvicorn>=0.27.0",
]

[project.scripts]
netroach = "netroach.cli:main"

[project.optional-dependencies]
dev = [
    "httpx2>=2.5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]
screenshots = [
    "playwright>=1.52.0",
]
desktop-build = [
    "pyinstaller>=6.0",
    "playwright>=1.52.0",
]

[tool.setuptools.packages.find]
include = ["netroach*"]

[tool.setuptools.package-data]
netroach = ["static/*.html"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
# Correctness and readability rules only: no formatter-style churn, and
# nothing that would rewrite working code for taste.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "A"]
ignore = [
    "B008",   # FastAPI dependencies are function calls in defaults by design.
    "SIM105", # contextlib.suppress hides which exception was tolerated.
    "SIM112", # Windows environment names are case-insensitive; SystemRoot is correct.
    "SIM117", # Nested with-blocks keep the resource that failed obvious.
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose.
"tests/*" = ["E501"]
# The tools/ scripts bootstrap sys.path before importing the package.
"tools/*" = ["E402"]
# Report templates are single-line HTML; wrapping them would change output.
"netroach/reports.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
# tools/ has no package marker, so mypy would see each script twice.
files = ["netroach"]
ignore_missing_imports = true
# The code is already fully annotated; these keep it that way without
# demanding a strict-mode cleanup first.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# scapy builds its protocol classes at import time, so a static checker sees
# none of them. The same goes for the optional desktop/report extras.
[[tool.mypy.overrides]]
module = ["scapy.*", "playwright.*", "openpyxl.*", "PIL.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.setuptools.dynamic]
version = {attr = "netroach.version.__version__"}
